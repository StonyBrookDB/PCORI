<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Facts Sequential - LSTM/GRU Training</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --bg-hover: #21262d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-yellow: #d29922;
            --accent-purple: #a371f7;
            --border-color: #30363d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { color: var(--accent-blue); font-size: 1.4rem; }
        .header a { color: var(--text-secondary); text-decoration: none; }
        .header a:hover { color: var(--accent-blue); }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .card h2 {
            color: var(--accent-blue);
            font-size: 1.1rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 0.6rem;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }

        .btn-primary:hover { background: #4c9aff; }
        .btn-primary:disabled { background: var(--bg-hover); cursor: not-allowed; }

        .info-box {
            background: var(--bg-dark);
            border-radius: 6px;
            padding: 0.8rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }

        .info-box .label { color: var(--text-secondary); }
        .info-box .value { color: var(--accent-green); font-weight: 500; }

        .status-box {
            background: var(--bg-dark);
            border-radius: 6px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .status-running { border-left: 3px solid var(--accent-yellow); }
        .status-completed { border-left: 3px solid var(--accent-green); }
        .status-failed { border-left: 3px solid var(--accent-red); }

        .progress-bar {
            background: var(--bg-hover);
            border-radius: 4px;
            height: 8px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .progress-bar .fill {
            background: var(--accent-blue);
            height: 100%;
            transition: width 0.3s;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .metric {
            background: var(--bg-hover);
            padding: 0.6rem;
            border-radius: 4px;
            text-align: center;
        }

        .metric .value {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent-green);
        }

        .metric .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .chart-container {
            height: 200px;
            margin-top: 1rem;
        }

        .jobs-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .job-item {
            background: var(--bg-dark);
            border-radius: 6px;
            padding: 0.8rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .job-item .name { font-weight: 500; }
        .job-item .status {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .job-item .status.running { background: rgba(210, 153, 34, 0.2); color: var(--accent-yellow); }
        .job-item .status.completed { background: rgba(63, 185, 80, 0.2); color: var(--accent-green); }
        .job-item .status.failed { background: rgba(248, 81, 73, 0.2); color: var(--accent-red); }

        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Health Facts Sequential</h1>
        <div>
            <a href="/">Back to Datasets</a>
        </div>
    </div>

    <div class="container">
        <div class="grid">
            <!-- Configuration Panel -->
            <div class="card">
                <h2>Model Configuration</h2>

                <div class="info-box" id="dataInfo">
                    <span class="label">Loading configuration...</span>
                </div>

                <div class="form-group">
                    <label>Feature Set</label>
                    <select id="featureSet">
                        <option value="">Loading...</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Sequence Length (T)</label>
                        <select id="seqLength">
                            <option value="5">5 encounters</option>
                            <option value="10" selected>10 encounters</option>
                            <option value="20">20 encounters</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Sample Fraction</label>
                        <select id="sampleFraction">
                            <option value="0.01">1% (fast)</option>
                            <option value="0.1">10%</option>
                            <option value="1.0">100% (full)</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Model Type</label>
                        <select id="modelType">
                            <option value="lstm">LSTM</option>
                            <option value="gru">GRU</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Hidden Size</label>
                        <select id="hiddenSize">
                            <option value="32">32</option>
                            <option value="64" selected>64</option>
                            <option value="128">128</option>
                            <option value="256">256</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Epochs</label>
                        <input type="number" id="epochs" value="10" min="1" max="100">
                    </div>
                    <div class="form-group">
                        <label>Batch Size</label>
                        <select id="batchSize">
                            <option value="64">64</option>
                            <option value="128">128</option>
                            <option value="256" selected>256</option>
                            <option value="512">512</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="useAttention" checked>
                        Use Attention Mechanism
                    </label>
                </div>

                <button class="btn btn-primary" id="trainBtn" onclick="startTraining()">
                    Start Training
                </button>
            </div>

            <!-- Status Panel -->
            <div class="card">
                <h2>Training Status</h2>

                <div id="currentJob">
                    <div class="info-box">
                        <span class="label">No active training job</span>
                    </div>
                </div>

                <div class="chart-container">
                    <canvas id="lossChart"></canvas>
                </div>

                <div id="metrics" style="display: none;">
                    <h3 style="margin-top: 1rem; font-size: 0.9rem; color: var(--text-secondary);">Final Metrics</h3>
                    <div class="metrics-grid">
                        <div class="metric">
                            <div class="value" id="metricAuroc">-</div>
                            <div class="label">AUROC</div>
                        </div>
                        <div class="metric">
                            <div class="value" id="metricAuprc">-</div>
                            <div class="label">AUPRC</div>
                        </div>
                        <div class="metric">
                            <div class="value" id="metricAcc">-</div>
                            <div class="label">Accuracy</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Training History -->
        <div class="card" style="margin-top: 2rem;">
            <h2>Training History</h2>
            <div class="jobs-list" id="jobsList">
                <div class="info-box">
                    <span class="label">No training jobs yet</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentJobId = null;
        let pollInterval = null;
        let lossChart = null;
        let trainingJobs = [];

        // Initialize chart
        function initChart() {
            const ctx = document.getElementById('lossChart').getContext('2d');
            lossChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'Train Loss',
                            data: [],
                            borderColor: '#58a6ff',
                            tension: 0.1
                        },
                        {
                            label: 'Val Loss',
                            data: [],
                            borderColor: '#3fb950',
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        // Load configuration from API
        async function loadConfig() {
            try {
                const res = await fetch(`${API_BASE}/api/dataset/health_facts_seq/config`);
                const config = await res.json();

                // Populate feature sets
                const featureSetSelect = document.getElementById('featureSet');
                featureSetSelect.innerHTML = config.feature_sets.map(fs =>
                    `<option value="${fs.name}" ${fs.name === 'core' ? 'selected' : ''}>
                        ${fs.name} (${fs.num_features} features)
                    </option>`
                ).join('');

                // Update info box
                document.getElementById('dataInfo').innerHTML = `
                    <span class="label">Dataset:</span>
                    <span class="value">Health Facts OUD/OD Prediction</span><br>
                    <span class="label">Label:</span>
                    <span class="value">${config.default_label} (1.20% positive)</span>
                `;

            } catch (e) {
                console.error('Failed to load config:', e);
                document.getElementById('dataInfo').innerHTML = `
                    <span style="color: var(--accent-red);">Failed to load configuration</span>
                `;
            }
        }

        // Start training
        async function startTraining() {
            const btn = document.getElementById('trainBtn');
            btn.disabled = true;
            btn.textContent = 'Starting...';

            const params = {
                feature_set: document.getElementById('featureSet').value,
                T: parseInt(document.getElementById('seqLength').value),
                sample_fraction: parseFloat(document.getElementById('sampleFraction').value),
                model_type: document.getElementById('modelType').value,
                hidden_size: parseInt(document.getElementById('hiddenSize').value),
                max_epochs: parseInt(document.getElementById('epochs').value),
                batch_size: parseInt(document.getElementById('batchSize').value),
                use_attention: document.getElementById('useAttention').checked,
                use_mmap: true,
                name: `${document.getElementById('modelType').value.toUpperCase()} ${document.getElementById('featureSet').value}`
            };

            try {
                const res = await fetch(`${API_BASE}/api/dataset/health_facts_seq/train`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params)
                });

                const data = await res.json();

                if (data.job_id) {
                    currentJobId = data.job_id;
                    trainingJobs.unshift({ id: data.job_id, name: params.name, status: 'running' });
                    updateJobsList();
                    startPolling();
                }

            } catch (e) {
                console.error('Failed to start training:', e);
                alert('Failed to start training: ' + e.message);
            }

            btn.disabled = false;
            btn.textContent = 'Start Training';
        }

        // Poll for training status
        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);

            pollInterval = setInterval(async () => {
                if (!currentJobId) return;

                try {
                    const res = await fetch(`${API_BASE}/api/dataset/health_facts_seq/training/${currentJobId}`);
                    const job = await res.json();
                    updateJobStatus(job);

                    if (job.status === 'completed' || job.status === 'failed') {
                        clearInterval(pollInterval);
                        pollInterval = null;
                    }
                } catch (e) {
                    console.error('Polling error:', e);
                }
            }, 2000);
        }

        // Update job status display
        function updateJobStatus(job) {
            const statusClass = job.status === 'running' || job.status === 'loading_data' || job.status === 'building_model' ? 'status-running' :
                               job.status === 'completed' ? 'status-completed' :
                               job.status === 'failed' ? 'status-failed' : 'status-running';

            // Backend returns: progress (%), epoch, max_epochs in params, train_losses[], val_losses[]
            const currentEpoch = job.epoch || 0;
            const totalEpochs = job.params?.max_epochs || 3;
            const pct = job.progress || 0;
            const jobName = job.params?.name || `${job.params?.model_type?.toUpperCase() || 'LSTM'} ${job.params?.feature_set || 'core'}`;

            // Format data info
            const dataInfo = job.data_info ?
                `${(job.data_info.n_train / 1e6).toFixed(1)}M samples, T=${job.data_info.T}, D=${job.data_info.D}` : '';

            document.getElementById('currentJob').innerHTML = `
                <div class="status-box ${statusClass}">
                    <strong>${jobName}</strong>
                    <span style="float: right; text-transform: capitalize;">${job.status}</span>
                    ${job.status === 'running' || job.status === 'training' ? `
                        <div class="progress-bar">
                            <div class="fill" style="width: ${pct}%"></div>
                        </div>
                        <small style="color: var(--text-secondary);">
                            Epoch ${currentEpoch} / ${totalEpochs} (${pct}%)
                            ${job.train_loss ? ` | Loss: ${job.train_loss.toFixed(4)}` : ''}
                        </small>
                        ${dataInfo ? `<div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.3rem;">${dataInfo}</div>` : ''}
                    ` : ''}
                    ${job.status === 'loading_data' ? '<small style="color: var(--text-secondary);">Loading data...</small>' : ''}
                    ${job.status === 'building_model' ? '<small style="color: var(--text-secondary);">Building model...</small>' : ''}
                    ${job.error ? `<div style="color: var(--accent-red); margin-top: 0.5rem; font-size: 0.85rem;">${job.error}</div>` : ''}
                </div>
            `;

            // Update chart with train/val losses
            if (job.train_losses && job.train_losses.length > 0) {
                lossChart.data.labels = job.train_losses.map((_, i) => `Epoch ${i + 1}`);
                lossChart.data.datasets[0].data = job.train_losses;
                lossChart.data.datasets[1].data = job.val_losses || [];
                lossChart.update();
            }

            // Update metrics if completed
            if (job.status === 'completed' && job.metrics) {
                document.getElementById('metrics').style.display = 'block';
                document.getElementById('metricAuroc').textContent = job.metrics.auc?.toFixed(4) || '-';
                document.getElementById('metricAuprc').textContent = job.metrics.auprc?.toFixed(4) || '-';
                document.getElementById('metricAcc').textContent = '-';
            }

            // Update jobs list
            const jobIdx = trainingJobs.findIndex(j => j.id === job.job_id);
            if (jobIdx >= 0) {
                trainingJobs[jobIdx].status = job.status;
                updateJobsList();
            }
        }

        async function fetchModelMetrics(modelId) {
            // For now, show placeholder - would need endpoint to get model info
            document.getElementById('metricAuroc').textContent = '-';
            document.getElementById('metricAuprc').textContent = '-';
            document.getElementById('metricAcc').textContent = '-';
        }

        function updateJobsList() {
            const list = document.getElementById('jobsList');
            if (trainingJobs.length === 0) {
                list.innerHTML = `<div class="info-box"><span class="label">No training jobs yet</span></div>`;
                return;
            }

            list.innerHTML = trainingJobs.map(job => `
                <div class="job-item" onclick="resumePolling('${job.job_id || job.id}')" style="cursor: pointer;">
                    <span class="name">${job.name || (job.params ? `${job.params.model_type?.toUpperCase() || 'LSTM'} ${job.params.feature_set || 'core'}` : job.job_id || job.id)}</span>
                    <span class="status ${job.status}">${job.status}</span>
                </div>
            `).join('');
        }

        // Load existing jobs from server
        async function loadExistingJobs() {
            try {
                const res = await fetch(`${API_BASE}/api/dataset/health_facts_seq/jobs`);
                const data = await res.json();

                if (data.jobs && data.jobs.length > 0) {
                    trainingJobs = data.jobs.map(job => ({
                        ...job,
                        id: job.job_id,
                        name: job.params?.name || `${job.params?.model_type?.toUpperCase() || 'LSTM'} ${job.params?.feature_set || 'core'}`
                    }));
                    updateJobsList();

                    // If there's a running job, show it and start polling
                    const runningJob = data.jobs.find(j => j.status === 'running' || j.status === 'training' || j.status === 'loading_data' || j.status === 'building_model');
                    if (runningJob) {
                        currentJobId = runningJob.job_id;
                        updateJobStatus(runningJob);
                        startPolling();
                    } else if (data.jobs.length > 0) {
                        // Show the most recent job
                        updateJobStatus(data.jobs[0]);
                    }
                }
            } catch (e) {
                console.error('Failed to load existing jobs:', e);
            }
        }

        // Resume polling for a specific job
        function resumePolling(jobId) {
            currentJobId = jobId;
            startPolling();
            // Immediately fetch status
            fetch(`${API_BASE}/api/dataset/health_facts_seq/training/${jobId}`)
                .then(res => res.json())
                .then(job => updateJobStatus(job))
                .catch(e => console.error('Failed to fetch job:', e));
        }

        // Initialize
        initChart();
        loadConfig();
        loadExistingJobs();
    </script>
</body>
</html>
