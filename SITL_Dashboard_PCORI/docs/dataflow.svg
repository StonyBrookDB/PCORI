<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
        </marker>
        <marker id="arrow3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#3fb950"/>
        </marker>
        <linearGradient id="userGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#238636"/>
            <stop offset="100%" style="stop-color:#196c2e"/>
        </linearGradient>
        <filter id="glow2">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="1200" height="600" fill="#0d1117"/>

    <!-- Title -->
    <text x="600" y="40" text-anchor="middle" fill="#58a6ff" font-size="26" font-weight="bold" font-family="system-ui, sans-serif">Data Flow: Quick Training Pipeline</text>
    <text x="600" y="65" text-anchor="middle" fill="#8b949e" font-size="14" font-family="system-ui, sans-serif">From user interaction to model results in under 1 second</text>

    <!-- Column Headers -->
    <text x="100" y="100" text-anchor="middle" fill="#8b949e" font-size="14" font-weight="600" font-family="system-ui, sans-serif">USER</text>
    <text x="320" y="100" text-anchor="middle" fill="#8b949e" font-size="14" font-weight="600" font-family="system-ui, sans-serif">FRONTEND</text>
    <text x="600" y="100" text-anchor="middle" fill="#8b949e" font-size="14" font-weight="600" font-family="system-ui, sans-serif">BACKEND API</text>
    <text x="880" y="100" text-anchor="middle" fill="#8b949e" font-size="14" font-weight="600" font-family="system-ui, sans-serif">ML ENGINE</text>
    <text x="1080" y="100" text-anchor="middle" fill="#8b949e" font-size="14" font-weight="600" font-family="system-ui, sans-serif">DATA</text>

    <!-- Vertical lines -->
    <line x1="100" y1="115" x2="100" y2="570" stroke="#21262d" stroke-width="2"/>
    <line x1="320" y1="115" x2="320" y2="570" stroke="#21262d" stroke-width="2"/>
    <line x1="600" y1="115" x2="600" y2="570" stroke="#21262d" stroke-width="2"/>
    <line x1="880" y1="115" x2="880" y2="570" stroke="#21262d" stroke-width="2"/>
    <line x1="1080" y1="115" x2="1080" y2="570" stroke="#21262d" stroke-width="2"/>

    <!-- User icon -->
    <circle cx="100" cy="145" r="25" fill="url(#userGrad2)" filter="url(#glow2)"/>
    <text x="100" y="152" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold" font-family="system-ui, sans-serif">U</text>

    <!-- Step 1: Define Cohort -->
    <rect x="70" y="185" width="60" height="30" rx="6" fill="#238636"/>
    <text x="100" y="205" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">1</text>
    <path d="M130 200 L230 200" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="180" y="190" text-anchor="middle" fill="#c9d1d9" font-size="12" font-family="system-ui, sans-serif">Define cohort</text>

    <rect x="235" y="180" width="170" height="45" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="320" y="200" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Cohort Builder</text>
    <text x="320" y="217" text-anchor="middle" fill="#8b949e" font-size="10" font-family="system-ui, sans-serif">Filter criteria selection</text>

    <!-- Step 2: POST filter -->
    <rect x="290" y="245" width="60" height="30" rx="6" fill="#238636"/>
    <text x="320" y="265" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">2</text>
    <path d="M355 260 L510 260" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="432" y="250" text-anchor="middle" fill="#c9d1d9" font-size="12" font-family="system-ui, sans-serif">POST /api/cohort/filter</text>

    <rect x="515" y="240" width="170" height="45" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
    <text x="600" y="260" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Filter Endpoint</text>
    <text x="600" y="277" text-anchor="middle" fill="#8b949e" font-size="10" font-family="system-ui, sans-serif">Validate and query</text>

    <!-- Step 3: Query DB -->
    <rect x="570" y="305" width="60" height="30" rx="6" fill="#238636"/>
    <text x="600" y="325" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">3</text>
    <path d="M635 320 L990 320" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="812" y="310" text-anchor="middle" fill="#c9d1d9" font-size="12" font-family="system-ui, sans-serif">SELECT patients WHERE criteria...</text>

    <rect x="995" y="300" width="170" height="45" rx="8" fill="#238636" stroke="#3fb950" stroke-width="2"/>
    <text x="1080" y="320" text-anchor="middle" fill="#fff" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Patient Database</text>
    <text x="1080" y="337" text-anchor="middle" fill="#aff5b4" font-size="10" font-family="system-ui, sans-serif">SQLite / Parquet</text>

    <!-- Step 4: Return IDs (response from DATA to FRONTEND) -->
    <path d="M995 345 L350 345" stroke="#3fb950" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow3)"/>
    <rect x="290" y="330" width="60" height="30" rx="6" fill="#238636"/>
    <text x="320" y="350" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">4</text>
    <text x="672" y="360" text-anchor="middle" fill="#8b949e" font-size="11" font-family="system-ui, sans-serif">Return matching patient IDs</text>

    <!-- Step 5: Click Train -->
    <rect x="70" y="390" width="60" height="30" rx="6" fill="#238636"/>
    <text x="100" y="410" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">5</text>
    <path d="M130 405 L230 405" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="180" y="395" text-anchor="middle" fill="#c9d1d9" font-size="12" font-family="system-ui, sans-serif">Train model</text>

    <rect x="235" y="385" width="170" height="45" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="320" y="405" text-anchor="middle" fill="#d29922" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Training UI</text>
    <text x="320" y="422" text-anchor="middle" fill="#8b949e" font-size="10" font-family="system-ui, sans-serif">Model selection</text>

    <!-- Step 6: POST train -->
    <rect x="290" y="450" width="60" height="30" rx="6" fill="#238636"/>
    <text x="320" y="470" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">6</text>
    <path d="M355 465 L510 465" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="432" y="455" text-anchor="middle" fill="#c9d1d9" font-size="12" font-family="system-ui, sans-serif">POST /api/train/quick</text>

    <rect x="515" y="445" width="170" height="60" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
    <text x="600" y="468" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Train Endpoint</text>
    <text x="600" y="485" text-anchor="middle" fill="#8b949e" font-size="10" font-family="system-ui, sans-serif">Load data, train model</text>
    <text x="600" y="498" text-anchor="middle" fill="#8b949e" font-size="10" font-family="system-ui, sans-serif">compute explanations</text>

    <!-- Step 7: Train Model -->
    <rect x="570" y="525" width="60" height="30" rx="6" fill="#238636"/>
    <text x="600" y="545" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">7</text>
    <path d="M635 540 L790 540" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="712" y="530" text-anchor="middle" fill="#c9d1d9" font-size="12" font-family="system-ui, sans-serif">Train + Explain</text>

    <rect x="795" y="515" width="170" height="55" rx="8" fill="#9a6700" stroke="#d29922" stroke-width="2"/>
    <text x="880" y="538" text-anchor="middle" fill="#fff" font-size="14" font-weight="600" font-family="system-ui, sans-serif">ML Engine</text>
    <text x="880" y="555" text-anchor="middle" fill="#ffd33d" font-size="11" font-family="system-ui, sans-serif">LightGBM + SHAP</text>
    <text x="880" y="568" text-anchor="middle" fill="#8b949e" font-size="10" font-family="system-ui, sans-serif">Sub-second execution</text>

    <!-- Step 8: Return results (ML Engine -> Result box -> User) -->
    <!-- Horizontal arrows at y=575, pointing left -->
    <path d="M795 575 L480 575" stroke="#3fb950" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow3)"/>
    <path d="M200 575 L130 575" stroke="#3fb950" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow3)"/>

    <!-- Result box -->
    <rect x="200" y="520" width="280" height="50" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="340" y="542" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="600" font-family="system-ui, sans-serif">8. Results returned to user</text>
    <text x="340" y="560" text-anchor="middle" fill="#8b949e" font-size="11" font-family="system-ui, sans-serif">Metrics, predictions, feature importance</text>

    <!-- Legend -->
    <rect x="50" y="585" width="20" height="4" fill="#58a6ff"/>
    <text x="78" y="590" fill="#8b949e" font-size="11" font-family="system-ui, sans-serif">Request</text>
    <rect x="150" y="585" width="20" height="4" fill="#3fb950" stroke-dasharray="4,2"/>
    <text x="178" y="590" fill="#8b949e" font-size="11" font-family="system-ui, sans-serif">Response</text>
</svg>
